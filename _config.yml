# Site settings. Restart `bundle exec jekyll serve` after editing this file.

title: Tochukwu Uzochukwu
tagline: Software consultant and forward deployed engineer
description: >-
  Software consultant and forward deployed engineer. I help companies
  automate work with AI, modernise the systems they rely on, and turn hard
  business problems into working software.
url: "https://tolexx.dev"
baseurl: ""
lang: en

# No theme: the layouts and styles all live in this repository.
# GitHub Pages would otherwise apply its default theme.
theme: null

author:
  name: Tochukwu Uzochukwu
  email: tochukwu@tolexx.dev
  url: "https://tolexx.dev"

# Used by jekyll-seo-tag for link previews and structured data.
twitter:
  username: 4tolexx
  card: summary_large_image
social:
  name: Tochukwu Uzochukwu
  links:
    - https://github.com/4tolexx
    - https://www.linkedin.com/in/uzochukwu-tochukwu-bb307683
    - https://x.com/4tolexx

# Links shown in the header, hero and footer.
links:
  email: tochukwu@tolexx.dev
  github: https://github.com/4tolexx
  linkedin: https://www.linkedin.com/in/uzochukwu-tochukwu-bb307683
  x: https://x.com/4tolexx
  hackernews: https://news.ycombinator.com/user?id=Tolexx
  resume: /assets/files/tochukwu-uzochukwu-resume.pdf

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .ruby-lsp
  - .ruby-version
  - README.md
