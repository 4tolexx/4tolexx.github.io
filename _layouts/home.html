---
layout: default
---
<section class="hero">
  <div class="tile tile-lg" aria-hidden="true">
    <span class="tile-symbol">Tu</span>
    <span class="tile-name">Tochukwu</span>
  </div>
  <div class="hero-text">
    <h1>{{ page.heading }}</h1>
    <p class="lede">{{ page.lede }}</p>
    <ul class="link-row" aria-label="Contact and profiles">
      <li><a href="mailto:{{ site.links.email }}">Email</a></li>
      <li><a href="{{ site.links.github }}">GitHub</a></li>
      <li><a href="{{ site.links.linkedin }}">LinkedIn</a></li>
      <li><a href="{{ site.links.resume | relative_url }}">Resume (PDF)</a></li>
    </ul>
  </div>
</section>

<div class="prose home">
  {{ content }}
</div>
