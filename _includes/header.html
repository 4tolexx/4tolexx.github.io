<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="tile tile-sm" aria-hidden="true">Tu</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ site.links.resume | relative_url }}">Resume</a>
    </nav>
  </div>
</header>
