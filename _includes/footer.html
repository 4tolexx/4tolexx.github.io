<footer class="site-footer">
  <div class="wrap site-footer-inner">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
    <ul class="link-row" aria-label="Elsewhere">
      <li><a href="mailto:{{ site.links.email }}">Email</a></li>
      <li><a href="{{ site.links.github }}">GitHub</a></li>
      <li><a href="{{ site.links.linkedin }}">LinkedIn</a></li>
      <li><a href="{{ site.links.x }}">X</a></li>
      <li><a href="{{ site.links.hackernews }}">Hacker News</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
    </ul>
  </div>
</footer>
