<!doctype html>
<!--
  Source for assets/images/og-default.png (the link preview image).
  Jekyll skips folders that start with "_", so this file is never published.
  Regenerate from the repository root. Headless Chrome leaves the bottom of a
  1200x630 window blank, so render a taller window and crop it:
    google-chrome --headless --hide-scrollbars --window-size=1200,800 \
      --virtual-time-budget=5000 --screenshot=assets/images/og-default.png _og/og-default.html
    python3 -c "from PIL import Image; p='assets/images/og-default.png'; Image.open(p).crop((0, 0, 1200, 630)).save(p)"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 0 96px;
    background: #faf4ed;
    color: #575279;
    font-family: "Literata", Georgia, serif;
    position: relative;
  }
  .main {
    display: flex;
    align-items: center;
    gap: 56px;
    height: 100%;
    padding-bottom: 40px;
    box-sizing: border-box;
  }
  .tile {
    flex: none;
    width: 216px;
    height: 216px;
    box-sizing: border-box;
    border: 6px solid #286983;
    border-radius: 10px;
    background: #fffaf3;
    color: #286983;
    display: grid;
    place-content: center;
    gap: 18px;
    text-align: center;
    line-height: 1;
  }
  .symbol { font-size: 92px; font-weight: 600; letter-spacing: -0.02em; }
  .name { font-size: 21px; color: #6e6a86; letter-spacing: 0.02em; }
  h1 { margin: 0 0 18px; font-size: 64px; font-weight: 600; line-height: 1.1; }
  .role { margin: 0 0 14px; font-size: 34px; color: #6e6a86; line-height: 1.25; }
  .line { margin: 0; font-size: 28px; color: #6e6a86; line-height: 1.35; }
  .domain { position: absolute; left: 96px; bottom: 56px; margin: 0; font-size: 28px; color: #286983; }
</style>
</head>
<body>
  <div class="main">
    <div class="tile"><span class="symbol">Tu</span><span class="name">Tochukwu</span></div>
    <div>
      <h1>Tochukwu Uzochukwu</h1>
      <p class="role">Software consultant and<br>forward deployed engineer</p>
      <p class="line">AI automation and software for<br>hard business problems</p>
    </div>
  </div>
  <p class="domain">tolexx.dev</p>
</body>
</html>
